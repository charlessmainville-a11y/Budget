<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Budget Tracker</title>
<style>
  :root{
    --bg:#0f1115; --panel:#151a24; --ink:#eaf0ff; --muted:#a6b0c6;
    --ring:#2a3246; --accent:#6cf; --ok:#2bd07b; --warn:#ffb020; --bad:#ff5d5d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,sans-serif}
  .wrap{max-width:860px;margin:0 auto;padding:20px}
  h1{margin:0 0 14px;text-align:center}
  .card{background:var(--panel);border:1px solid var(--ring);border-radius:14px;padding:16px;margin:12px 0}
  .row{margin:16px 0}
  .rowtop{display:flex;justify-content:space-between;align-items:end;margin-bottom:6px}
  .label{font-weight:800}
  .value{color:var(--accent);font-weight:800}
  input[type="range"]{width:100%}
  .btns{display:flex;gap:10px;justify-content:center;margin-top:10px}
  button{padding:10px 12px;border-radius:10px;border:1px solid var(--ring);
         background:#111827;color:var(--ink);font-weight:800}
  button:disabled{opacity:.6}

  /* Top wheel + readouts */
  .dial-wrap{display:grid;justify-items:center;gap:10px;margin-top:8px}
  .dial{position:relative;width:220px;height:220px}
  canvas{width:220px;height:220px;touch-action:none}
  .dial-read{
    position:absolute;inset:0;display:grid;place-items:center;text-align:center;
    font-weight:900;color:var(--accent)
  }
  .dial-read .sub{display:block;font-size:.9rem;color:var(--muted);font-weight:700}
  .remain{text-align:center;margin-top:6px}
  .ok{color:var(--ok)} .mid{color:var(--warn)} .low{color:var(--bad)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Budget Tracker</h1>

  <!-- TOP: Income dial + totals -->
  <section class="card">
    <div class="dial-wrap">
      <div class="dial">
        <canvas id="dial" width="220" height="220" aria-label="Income dial"></canvas>
        <div class="dial-read">
          <div>
            <span class="sub">Per-pay Income</span>
            <div id="incomeText" style="font-size:1.8rem">$0</div>
            <div class="sub">(cap $1,400)</div>
          </div>
        </div>
      </div>
      <!-- accessible fallback / fine-tune slider (snaps to $25) -->
      <div style="width:100%;max-width:420px">
        <div class="rowtop">
          <div class="label">Adjust Income</div>
          <div class="value" id="incomeTextSmall">$0</div>
        </div>
        <input id="incomeRange" type="range" min="0" max="1400" step="25" value="0"/>
      </div>
      <div class="remain">
        Total: <strong id="total">$0</strong>
        &nbsp;&nbsp;|&nbsp;&nbsp;
        Remaining: <strong id="remaining" class="ok">$0</strong>
      </div>
    </div>
  </section>

  <!-- Categories -->
  <section class="card">
    <div class="row">
      <div class="rowtop"><div class="label">Bills/Daniel (max $900)</div><div class="value" id="billsV">$0</div></div>
      <input type="range" id="bills" min="0" max="900" step="5" value="0"/>
    </div>

    <div class="row">
      <div class="rowtop"><div class="label">💸 Fun Money (max $500)</div><div class="value" id="funV">$0</div></div>
      <input type="range" id="fun" min="0" max="500" step="5" value="0"/>
    </div>

    <div class="row">
      <div class="rowtop"><div class="label">Tim’s (max $40)</div><div class="value" id="timsV">$0</div></div>
      <input type="range" id="tims" min="0" max="40" step="5" value="0"/>
    </div>

    <div class="row">
      <div class="rowtop"><div class="label">Booze (max $60)</div><div class="value" id="boozeV">$0</div></div>
      <input type="range" id="booze" min="0" max="60" step="5" value="0"/>
    </div>

    <div class="row">
      <div class="rowtop"><div class="label">Food (max $50)</div><div class="value" id="foodV">$0</div></div>
      <input type="range" id="food" min="0" max="50" step="5" value="0"/>
    </div>

    <div class="row">
      <div class="rowtop"><div class="label">Bus (max $40)</div><div class="value" id="busV">$0</div></div>
      <input type="range" id="bus" min="0" max="40" step="5" value="0"/>
    </div>

    <div class="row">
      <div class="rowtop"><div class="label">Other (max $300)</div><div class="value" id="otherV">$0</div></div>
      <input type="range" id="other" min="0" max="300" step="5" value="0"/>
    </div>

    <div class="btns">
      <button id="even">Even split (Bills → Fun priority)</button>
      <button id="reset">Reset</button>
    </div>
  </section>
</div>

<script>
/* ===== State / config ===== */
const LS_KEY = "budget-dial-fun-v4";
const INCOME_MAX = 1400;
const INCOME_STEP = 25;     // dial snaps to $25

// Haptics (Android/Chrome; iOS Safari does not support navigator.vibrate)
const HAPTIC_DIAL_STEP   = 5;   // buzz every $5 on income dial
const HAPTIC_DIAL_STRONG = 100; // extra buzz on $100 marks
const HAPTIC_SLIDER_STEP = 5;   // buzz every $5 on category sliders

// Order matters (for priority + water-filling)
const CAT_IDS = ["bills","fun","tims","booze","food","bus","other"];
const CAPS = { bills:900, fun:500, tims:40, booze:60, food:50, bus:40, other:300 };

/* ===== DOM ===== */
const $ = id => document.getElementById(id);
const dialCanvas = $("dial");
const incomeRange = $("incomeRange");
const incomeText = $("incomeText");
const incomeTextSmall = $("incomeTextSmall");
const totalEl = $("total");
const remainingEl = $("remaining");
const evenBtn = $("even");
const resetBtn = $("reset");

const sliders = Object.fromEntries(CAT_IDS.map(id => [id, $(id)]));
const reads   = Object.fromEntries(CAT_IDS.map(id => [id, $(id+"V")]));

/* ===== Utils ===== */
const int = v => parseInt(v || "0", 10);
const money = n => "$" + (Math.round(n)||0).toLocaleString();
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const sumCats = () => CAT_IDS.reduce((a,id)=> a + int(sliders[id].value), 0);

/* ===== Haptics helpers ===== */
let lastDialBucket = 0;
const lastSliderBucket = Object.fromEntries(CAT_IDS.map(id => [id, 0]));
function buzz(ms=10){ if("vibrate" in navigator){ try{ navigator.vibrate(ms);}catch{} } }
function buzzPattern(p){ if("vibrate" in navigator){ try{ navigator.vibrate(p);}catch{} } }

/* ===== Persistence ===== */
function save(){
  const data = {
    income: int(incomeRange.value),
    values: Object.fromEntries(CAT_IDS.map(id => [id, int(sliders[id].value)]))
  };
  localStorage.setItem(LS_KEY, JSON.stringify(data));
}
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    if(Number.isFinite(d.income)) incomeRange.value = clamp(Math.round(d.income/INCOME_STEP)*INCOME_STEP, 0, INCOME_MAX);
    if(d.values) CAT_IDS.forEach(id=>{
      const cap = CAPS[id];
      const v = Number.isFinite(d.values[id]) ? clamp(d.values[id], 0, cap) : 0;
      sliders[id].value = v;
    });
  }catch{}
}

/* ===== Dial (canvas) ===== */
const ctx = dialCanvas.getContext("2d");
const W = dialCanvas.width, H = dialCanvas.height;
const CX = W/2, CY = H/2, R = 92; // ring radius
const RING_W = 18;

function drawDial(){
  const inc = int(incomeRange.value);
  ctx.clearRect(0,0,W,H);

  // background ring
  ctx.beginPath();
  ctx.arc(CX, CY, R, 0, Math.PI*2);
  ctx.strokeStyle = "#27304a";
  ctx.lineWidth = RING_W;
  ctx.stroke();

  // value arc (0..INCOME_MAX)
  const pct = inc / INCOME_MAX;
  const start = -Math.PI/2; // top
  const end = start + pct * Math.PI*2;

  ctx.beginPath();
  ctx.arc(CX, CY, R, start, end, false);
  ctx.strokeStyle = "#6cf";
  ctx.lineWidth = RING_W;
  ctx.lineCap = "round";
  ctx.stroke();
}

function angleFromPoint(x,y){
  const dx = x - CX;
  const dy = y - CY;
  let ang = Math.atan2(dy, dx); // -PI..PI, 0 at +X axis
  // convert to 0 at top, clockwise
  ang = ang + Math.PI/2;
  if (ang < 0) ang += Math.PI*2;
  return ang; // 0..2PI
}
function incomeFromAngle(ang){
  const pct = clamp(ang / (Math.PI*2), 0, 1);
  const raw = Math.round(pct * INCOME_MAX);
  // keep dial snapping to $25 for control
  return Math.round(raw / INCOME_STEP) * INCOME_STEP;
}
let dragging = false;

function pointerToIncome(ev){
  const rect = dialCanvas.getBoundingClientRect();
  const x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - rect.left;
  const y = (ev.touches ? ev.touches[0].clientY : ev.clientY) - rect.top;
  const a = angleFromPoint(x,y);
  return incomeFromAngle(a);
}
function onPointerDown(ev){
  dragging = true;
  const val = pointerToIncome(ev);
  setIncome(val, true);
  ev.preventDefault();
}
function onPointerMove(ev){
  if(!dragging) return;
  const val = pointerToIncome(ev);
  setIncome(val, true);
  ev.preventDefault();
}
function onPointerUp(){ dragging = false; }

dialCanvas.addEventListener("mousedown", onPointerDown);
window.addEventListener("mousemove", onPointerMove);
window.addEventListener("mouseup", onPointerUp);
dialCanvas.addEventListener("touchstart", onPointerDown, {passive:false});
window.addEventListener("touchmove", onPointerMove, {passive:false});
window.addEventListener("touchend", onPointerUp);

/* ===== Core logic ===== */
function reflectIncome(){
  const inc = int(incomeRange.value);
  incomeText.textContent = money(inc);
  incomeTextSmall.textContent = money(inc);
}

function reflectCatsAndTotals(){
  CAT_IDS.forEach(id=>{
    reads[id].textContent = money(sliders[id].value);
  });

  const inc = int(incomeRange.value);
  const total = sumCats();
  const rem = Math.max(0, inc - total);
  totalEl.textContent = money(total);
  remainingEl.textContent = money(rem);

  remainingEl.classList.remove("ok","mid","low");
  if (!inc || rem/inc >= .5) remainingEl.classList.add("ok");
  else if (rem/inc >= .2)    remainingEl.classList.add("mid");
  else                       remainingEl.classList.add("low");
}

/*
  Fit-to-income with rules:
  - If over budget, pull from FUN first.
  - Then reduce others proportionally, but NEVER reduce Bills unless you're actively dragging Bills.
  - Also never reduce the active slider (respect user intent).
*/
function fitCategoriesToIncome(activeId = null){
  const inc = int(incomeRange.value);

  // Clamp each to its cap
  CAT_IDS.forEach(id=>{
    sliders[id].value = clamp(int(sliders[id].value), 0, CAPS[id]);
  });

  let total = sumCats();
  if (total <= inc) return;

  let overflow = total - inc;

  // 1) Take from FUN first (even if FUN is active; it's the buffer)
  if (overflow > 0){
    const funCur = int(sliders.fun.value);
    if (funCur > 0){
      const take = Math.min(funCur, overflow);
      sliders.fun.value = funCur - take;
      overflow -= take;
      if (take > 0) buzz(8);
    }
  }

  // 2) If still over, reduce others proportionally (exclude Bills unless Bills is active; exclude activeId)
  if (overflow > 0){
    let passes = 0;
    while (overflow > 0 && passes < 6){
      passes++;

      const poolIds = CAT_IDS.filter(id => {
        if (id === "fun") return false;             // already hit
        if (id === activeId) return false;          // respect user intent
        if (id === "bills" && activeId !== "bills") return false; // protect Bills
        return int(sliders[id].value) > 0;
      });

      if (poolIds.length === 0){
        // Last resort: clamp the active slider if it exists & caused overflow
        if (activeId){
          const allowed = Math.max(0, inc - (sumCats() - int(sliders[activeId].value)));
          const cur = int(sliders[activeId].value);
          if (cur > allowed){
            sliders[activeId].value = Math.min(CAPS[activeId], allowed);
            overflow = 0;
            buzz(6);
          } else {
            break;
          }
        }
        break;
      }

      const poolSum = poolIds.reduce((a,id)=> a + int(sliders[id].value), 0);
      if (poolSum === 0) break;

      let removedThisPass = 0;
      poolIds.forEach(id=>{
        if (overflow <= 0) return;
        const cur = int(sliders[id].value);
        const share = Math.max(1, Math.floor(overflow * (cur / poolSum)));
        const newVal = Math.max(0, cur - share);
        const took = cur - newVal;
        sliders[id].value = newVal;
        removedThisPass += took;
      });
      overflow = Math.max(0, overflow - removedThisPass);
      if (removedThisPass > 0) buzz(6);
    }
  }
}

// When income increases (or you reduce categories), let Fun absorb what's left (up to its cap)
function absorbRemainderIntoFun(){
  const inc = int(incomeRange.value);
  const total = sumCats();
  if (total >= inc) return;
  const remaining = inc - total;
  const funSpace = CAPS.fun - int(sliders.fun.value);
  if (funSpace <= 0) return;
  const add = Math.min(funSpace, remaining);
  if (add > 0){
    sliders.fun.value = int(sliders.fun.value) + add;
  }
}

function setIncome(v, fromDial = false){
  const clamped = clamp(Math.round(v/INCOME_STEP)*INCOME_STEP, 0, INCOME_MAX);
  if (int(incomeRange.value) !== clamped){
    incomeRange.value = clamped;
  }
  reflectIncome();

  // Keep within income with our rules
  fitCategoriesToIncome();

  // Then auto-top-up Fun if there's room
  absorbRemainderIntoFun();

  reflectCatsAndTotals();
  save();
  drawDial();

  // Haptics every $5; stronger buzz at $100 marks
  if (fromDial){
    const vNow = int(incomeRange.value);
    const bucket = Math.floor(vNow / HAPTIC_DIAL_STEP);
    if (bucket !== lastDialBucket){ buzz(10); lastDialBucket = bucket; }
    if (vNow % HAPTIC_DIAL_STRONG === 0) buzzPattern([15,20,15]);
  }
}

/* ===== Events ===== */
incomeRange.addEventListener("input", e => setIncome(int(e.target.value)));

CAT_IDS.forEach(id=>{
  sliders[id].addEventListener("input", ()=>{
    // snap to $5 and clamp to cap
    const snapped = Math.round(int(sliders[id].value)/5)*5;
    sliders[id].value = clamp(snapped, 0, CAPS[id]);

    // per-slider haptics every $5
    const v = int(sliders[id].value);
    const b = Math.floor(v / HAPTIC_SLIDER_STEP);
    if (b !== lastSliderBucket[id]) { buzz(10); lastSliderBucket[id] = b; }

    // Keep total within income (FUN first; protect Bills unless active)
    fitCategoriesToIncome(id);

    // If we created leftover (e.g., lowered something), let Fun absorb it up to cap
    absorbRemainderIntoFun();

    reflectCatsAndTotals();
    save();
    drawDial();
  });
});

evenBtn.addEventListener("click", ()=>{
  const inc = int(incomeRange.value);
  if(!inc) return;

  // Priority: Bills up to cap, then Fun up to cap, then water-fill the rest (respect caps)
  CAT_IDS.forEach(id => sliders[id].value = 0);

  let remaining = inc;

  // Bills first (do not exceed cap)
  const billsAdd = Math.min(CAPS.bills, remaining);
  sliders.bills.value = billsAdd; remaining -= billsAdd;

  // Fun next
  const funAdd = Math.min(CAPS.fun, remaining);
  sliders.fun.value = funAdd; remaining -= funAdd;

  // Water-fill the rest across remaining categories respecting caps
  const REST = CAT_IDS.filter(id => id !== "bills" && id !== "fun");
  let open = new Set(REST);
  while (remaining > 0 && open.size > 0){
    const share = Math.max(5, Math.floor(remaining / open.size / 5) * 5); // even + multiple of 5
    for (const id of [...open]){
      const space = CAPS[id] - int(sliders[id].value);
      const add = Math.min(share, space, remaining);
      const snappedAdd = Math.max(0, Math.floor(add/5)*5);
      sliders[id].value = int(sliders[id].value) + snappedAdd;
      remaining -= snappedAdd;
      if (int(sliders[id].value) >= CAPS[id]) open.delete(id);
      if (remaining <= 0) break;
    }
  }

  reflectCatsAndTotals(); save(); drawDial();
});

resetBtn.addEventListener("click", ()=>{
  if(!confirm("Reset income and all categories on this device?")) return;
  incomeRange.value = 0;
  CAT_IDS.forEach(id => sliders[id].value = 0);
  localStorage.removeItem(LS_KEY);
  incomeText.textContent = "$0";
  incomeTextSmall.textContent = "$0";
  totalEl.textContent = "$0";
  remainingEl.textContent = "$0";
  remainingEl.className = "ok";
  drawDial();
  lastDialBucket = 0;
  Object.keys(lastSliderBucket).forEach(k=> lastSliderBucket[k]=0);
});

/* ===== Init ===== */
load();
incomeText.textContent = money(int(incomeRange.value));
incomeTextSmall.textContent = money(int(incomeRange.value));
reflectCatsAndTotals();
drawDial();

/* ===== Dial pointer wiring ===== */
function pointerHandlerFactory(down, move, up){
  dialCanvas.addEventListener("mousedown", down);
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);
  dialCanvas.addEventListener("touchstart", down, {passive:false});
  window.addEventListener("touchmove", move, {passive:false});
  window.addEventListener("touchend", up);
}
pointerHandlerFactory(
  function onPointerDown(ev){
    dragging = true;
    const val = pointerToIncome(ev);
    setIncome(val, true);
    ev.preventDefault();
  },
  function onPointerMove(ev){
    if(!dragging) return;
    const val = pointerToIncome(ev);
    setIncome(val, true);
    ev.preventDefault();
  },
  function onPointerUp(){ dragging = false; }
);
</script>
</body>
</html>
