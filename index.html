<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Budget Tracker</title>
  <style>
    :root {
      --bg: #111;
      --panel: #1b1b1b;
      --text: #f5f5f5;
      --accent: #6cf;
      --good: #28d07f;
      --warn: #ffb020;
      --bad: #ff5d5d;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 22px;
    }
    h1 { text-align:center; margin: 0 0 14px; }
    .row { max-width: 760px; margin: 0 auto; }

    /* Big top bubble shows REMAINING */
    .total-bubble {
      display:flex; align-items:center; justify-content:center;
      width: 190px; height: 190px; border-radius: 50%;
      margin: 12px auto 24px; font-size: 1.6rem; font-weight: 800;
      background: #202020; color: var(--accent); border: 4px solid var(--accent);
      text-align:center; line-height:1.2;
    }
    .bubble-sub { display:block; font-size:.85rem; font-weight:600; opacity:.9; }

    .card {
      background: var(--panel); border-radius:12px; padding:16px 16px 4px;
      margin-bottom: 16px;
    }
    .income-wrap {
      display:grid; grid-template-columns: 1fr 140px; gap:10px; align-items:center;
    }
    .label { font-weight:800; letter-spacing:.2px; }
    .input-money {
      width:100%; padding:10px 12px; border-radius:8px; border:1px solid #333;
      background:#0f0f0f; color:var(--text); font-size:1rem;
    }
    .hint { font-size:.85rem; opacity:.8; margin-top:6px; }

    .category { margin:18px 0; }
    .category .rowtop { display:flex; justify-content:space-between; align-items:end; }
    .value { color: var(--accent); font-weight:800; margin-left: 8px; }
    input[type="range"] { width: 100%; }

    .bottom {
      text-align:center; margin-top: 8px; font-size: 1.2rem; font-weight: 800;
    }
    .pill {
      display:inline-block; padding:6px 10px; border-radius:999px; background:#222; margin-top:6px;
    }
    .btnbar { display:flex; gap:8px; justify-content:center; margin-top:10px; }
    button {
      padding:9px 12px; border-radius:8px; border:1px solid #333; background:#1f1f1f;
      color:var(--text); font-weight:700;
    }
    button:disabled { opacity:.55; }
    .muted { opacity:.75; font-weight:600; }

    /* bubble color by remaining */
    .ok { border-color: var(--good); color: var(--good); }
    .mid { border-color: var(--warn); color: var(--warn); }
    .low { border-color: var(--bad); color: var(--bad); }
  </style>
</head>
<body>
  <div class="row">
    <h1>Budget Tracker</h1>

    <!-- Big bubble: Remaining = Income - Total -->
    <div id="bubble" class="total-bubble">
      <span>
        <span class="bubble-sub">Remaining</span>
        <span id="remaining">$0</span>
      </span>
    </div>

    <!-- Income card -->
    <div class="card">
      <div class="income-wrap">
        <div class="label">Monthly Income</div>
        <input id="income" class="input-money" type="number" inputmode="decimal" min="0" step="1" placeholder="e.g. 3000" />
      </div>
      <div id="incomeHint" class="hint">Enter your income to unlock the sliders.</div>
    </div>

    <!-- Categories -->
    <div class="card">
      <div class="category">
        <div class="rowtop">
          <div class="label">Food</div>
          <div><span id="foodValue" class="value">$0</span></div>
        </div>
        <input type="range" id="food" min="0" max="100" step="1" value="0" disabled />
      </div>

      <div class="category">
        <div class="rowtop">
          <div class="label">Transport</div>
          <div><span id="transportValue" class="value">$0</span></div>
        </div>
        <input type="range" id="transport" min="0" max="100" step="1" value="0" disabled />
      </div>

      <div class="category">
        <div class="rowtop">
          <div class="label">Entertainment</div>
          <div><span id="entertainmentValue" class="value">$0</span></div>
        </div>
        <input type="range" id="entertainment" min="0" max="100" step="1" value="0" disabled />
      </div>

      <div class="category">
        <div class="rowtop">
          <div class="label">Savings</div>
          <div><span id="savingsValue" class="value">$0</span></div>
        </div>
        <input type="range" id="savings" min="0" max="100" step="1" value="0" disabled />
      </div>

      <div class="bottom">
        Total: <span id="total" class="pill">$0</span>
        <div class="muted">Sliders are capped so the sum never exceeds your income.</div>
      </div>
      <div class="btnbar">
        <button id="reset">Reset</button>
        <button id="maxOut">Auto-fill to Income</button>
      </div>
    </div>
  </div>

  <script>
    // --- Config ---
    const cats = ["food", "transport", "entertainment", "savings"];
    const LS_KEY = "budget-v3";

    // --- Elements ---
    const incomeEl = document.getElementById("income");
    const bubble = document.getElementById("bubble");
    const remainingEl = document.getElementById("remaining");
    const totalEl = document.getElementById("total");
    const incomeHint = document.getElementById("incomeHint");
    const resetBtn = document.getElementById("reset");
    const maxBtn = document.getElementById("maxOut");

    const sliders = {};
    const reads = {};
    cats.forEach(c => {
      sliders[c] = document.getElementById(c);
      reads[c] = document.getElementById(c + "Value");
    });

    // --- Helpers ---
    const money = n => "$" + (Math.round(n) || 0);

    const sumValues = () =>
      cats.reduce((acc, c) => acc + parseInt(sliders[c].value || "0", 10), 0);

    function setSlidersEnabled(enabled) {
      cats.forEach(c => (sliders[c].disabled = !enabled));
      incomeHint.textContent = enabled
        ? "Drag the sliders. Total can't exceed your income."
        : "Enter your income to unlock the sliders.";
    }

    function save() {
      const data = {
        income: parseInt(incomeEl.value || "0", 10),
        values: Object.fromEntries(cats.map(c => [c, parseInt(sliders[c].value || "0", 10)])),
      };
      localStorage.setItem(LS_KEY, JSON.stringify(data));
    }

    function load() {
      try {
        const raw = localStorage.getItem(LS_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (Number.isFinite(data.income)) incomeEl.value = data.income;
        if (data.values) {
          cats.forEach(c => {
            if (Number.isFinite(data.values[c])) sliders[c].value = data.values[c];
          });
        }
      } catch {}
    }

    function colorBubble(rem, income) {
      bubble.classList.remove("ok", "mid", "low");
      const pct = income ? rem / income : 1;
      if (pct >= 0.5) bubble.classList.add("ok");
      else if (pct >= 0.2) bubble.classList.add("mid");
      else bubble.classList.add("low");
    }

    // Ensure the slider being moved doesn't push total over income
    function clampActiveSlider(activeId, income) {
      const others = cats.filter(c => c !== activeId);
      const othersSum = others.reduce((a, c) => a + parseInt(sliders[c].value || "0", 10), 0);
      const allowed = Math.max(0, income - othersSum);
      const current = parseInt(sliders[activeId].value || "0", 10);
      if (current > allowed) sliders[activeId].value = allowed;
    }

    function updateUI(activeId = null) {
      const income = parseInt(incomeEl.value || "0", 10);

      // Gate sliders by income
      setSlidersEnabled(income > 0);

      // If we’re moving a slider, clamp it so total <= income
      if (income > 0 && activeId) clampActiveSlider(activeId, income);

      // Reflect amounts
      cats.forEach(c => {
        reads[c].textContent = money(sliders[c].value);
      });

      const total = sumValues();
      const remaining = Math.max(0, income - total);

      totalEl.textContent = money(total);
      remainingEl.textContent = money(remaining);
      colorBubble(remaining, income);

      save();
    }

    // Auto-fill so total == income (splits remaining across categories)
    function maxOutToIncome() {
      const income = parseInt(incomeEl.value || "0", 10);
      if (!income) return;

      // Keep current proportions, then scale up/down to exactly income
      const vals = cats.map(c => parseInt(sliders[c].value || "0", 10));
      let total = vals.reduce((a, b) => a + b, 0);
      const remaining = income - total;

      if (remaining === 0) return;

      // Simple greedy fill left-to-right
      let left = remaining;
      cats.forEach((c, i) => {
        if (left === 0) return;
        const add = Math.ceil(left / (cats.length - i));
        sliders[c].value = Math.max(0, parseInt(sliders[c].value, 10) + add);
        total = sumValues();
        if (total > income) sliders[c].value = Math.max(0, parseInt(sliders[c].value, 10) - (total - income));
        left = income - sumValues();
      });

      updateUI(); // will save
    }

    function resetAll() {
      incomeEl.value = "";
      cats.forEach(c => (sliders[c].value = 0));
      updateUI();
      localStorage.removeItem(LS_KEY);
    }

    // --- Events ---
    incomeEl.addEventListener("input", () => updateUI());
    cats.forEach(c => {
      sliders[c].addEventListener("input", () => updateUI(c));
    });
    resetBtn.addEventListener("click", resetAll);
    maxBtn.addEventListener("click", maxOutToIncome);

    // --- Init ---
    load();
    updateUI();
  </script>
</body>
</html>
