<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Budget Tracker — Neon Edition</title>
<style>
  /* ====== DP-ish palette + background image hook ====== */
  :root{
    --bg:#05060a;
    --panel:#0a0d14;
    --glass:#0e121b;
    --ink:#e9f6ff;
    --muted:#9cb3d1;
    --ring:#151b29;
    --gold:#e6bf29;
    --neon:#5df2ff;   /* cyan */
    --neon2:#ff4ed9;  /* magenta */
    --ok:#18ffb2;
    --warn:#ffb020;
    --bad:#ff5d5d;

    /* >>>>> PUT YOUR IMAGE URL HERE <<<<< */
    --bg-img: url("YOUR_IMAGE_URL_HERE");
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    color:var(--ink);
    /* 1) Your image, 2) vignette gradient, 3) deep bg base */
    background:
      linear-gradient(rgba(5,6,10,0.60), rgba(5,6,10,0.85)),
      var(--bg-img) center/cover no-repeat fixed,
      radial-gradient(1000px 600px at 20% -10%, #0b0f17 0%, #05060a 60%) fixed;
    font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,sans-serif;
    overflow-x:hidden;
  }

  /* Animated grid + scanlines (subtle) */
  body::before{
    content:"";
    position:fixed; inset:0;
    background:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 30px 30px, 30px 30px;
    pointer-events:none;
    animation: drift 30s linear infinite;
    mix-blend-mode:overlay;
  }
  body::after{
    content:"";
    position:fixed; inset:0;
    background: repeating-linear-gradient(transparent 0 2px, rgba(255,255,255,0.025) 2px 3px);
    pointer-events:none; mix-blend-mode:screen;
  }
  @keyframes drift{
    from{ transform: translateY(0) }
    to{ transform: translateY(30px) }
  }

  .wrap{max-width:920px; margin:0 auto; padding:24px}

  /* Header: neon glow */
  h1{
    margin:0 0 8px;
    text-align:center;
    font-weight:900;
    letter-spacing:0.5px;
    color:var(--ink);
    text-shadow:
      0 0 12px rgba(93,242,255,0.35),
      0 0 24px rgba(255,78,217,0.2);
  }
  .subtitle{
    text-align:center;
    color:var(--muted);
    margin-bottom:18px;
    font-weight:700;
    letter-spacing:1.5px;
  }

  /* Neon card frame */
  .card{
    position:relative;
    background: linear-gradient(180deg, rgba(14,18,27,0.88), rgba(10,13,20,0.92));
    border:1px solid var(--ring);
    border-radius:16px;
    padding:18px;
    margin:14px 0;
    box-shadow:
      0 0 0 1px rgba(93,242,255,0.08) inset,
      0 10px 35px rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
  }
  .card::before{
    content:"";
    position:absolute; inset:-1px;
    border-radius:16px;
    background: linear-gradient(135deg, rgba(93,242,255,0.35), rgba(230,191,41,0.35), rgba(255,78,217,0.35));
    filter: blur(22px);
    opacity:.22; pointer-events:none;
  }

  .row{margin:18px 0}
  .rowtop{display:flex;justify-content:space-between;align-items:end;margin-bottom:8px}
  .label{
    font-weight:900; letter-spacing:.3px;
    display:flex; align-items:center; gap:10px;
    text-shadow:0 0 8px rgba(93,242,255,0.25);
  }
