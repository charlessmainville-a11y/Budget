<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget Tracker</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 20px;
      background: #111;
      color: #f5f5f5;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    .category {
      margin: 20px 0;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }
    input[type="range"] {
      width: 100%;
    }
    .value {
      margin-left: 10px;
      color: #6cf;
      font-weight: bold;
    }
    .total {
      margin-top: 30px;
      font-size: 18px;
      text-align: center;
      font-weight: bold;
      color: #0f0;
    }
  </style>
</head>
<body>
  <h1>Budget Tracker</h1>

  <div class="category">
    <label>Food: <span class="value" id="foodValue">$0</span></label>
    <input type="range" id="food" min="0" max="100" value="0">
  </div>

  <div class="category">
    <label>Transport: <span class="value" id="transportValue">$0</span></label>
    <input type="range" id="transport" min="0" max="100" value="0">
  </div>

  <div class="category">
    <label>Entertainment: <span class="value" id="entertainmentValue">$0</span></label>
    <input type="range" id="entertainment" min="0" max="100" value="0">
  </div>

  <div class="category">
    <label>Savings: <span class="value" id="savingsValue">$0</span></label>
    <input type="range" id="savings" min="0" max="100" value="0">
  </div>

  <div class="total">
    Total: <span id="total">$0</span>
  </div>

  <script>
    const categories = ["food", "transport", "entertainment", "savings"];

    // Load saved values
    categories.forEach(cat => {
      const saved = localStorage.getItem(cat);
      if (saved !== null) {
        document.getElementById(cat).value = saved;
        document.getElementById(cat + "Value").innerText = "$" + saved;
      }
    });
    updateTotal();

    // Event listeners for sliders
    categories.forEach(cat => {
      const slider = document.getElementById(cat);
      slider.addEventListener("input", () => {
        const value = slider.value;
        document.getElementById(cat + "Value").innerText = "$" + value;
        localStorage.setItem(cat, value);
        updateTotal();
      });
    });

    function updateTotal() {
      let total = 0;
      categories.forEach(cat => {
        total += parseInt(localStorage.getItem(cat) || 0, 10);
      });
      document.getElementById("total").innerText = "$" + total;
    }
  </script>
</body>
</html>
