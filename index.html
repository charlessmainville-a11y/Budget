<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Budget Tracker</title>
  <style>
    :root{
      --bg:#101010;--panel:#181818;--ink:#f5f5f5;--accent:#6cf;
      --good:#23d07b;--warn:#ffb020;--bad:#ff5d5d
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    .wrap{max-width:820px;margin:0 auto;padding:22px}
    h1{margin:0 0 14px;text-align:center}
    .bubble{
      width:210px;height:210px;margin:10px auto 14px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;text-align:center;
      font-weight:900;line-height:1.15;font-size:1.8rem;border:4px solid var(--accent);color:var(--accent)
    }
    .sub{display:block;font-size:.85rem;font-weight:700;opacity:.9}
    .remain{margin:0 auto 16px;text-align:center;opacity:.9}
    .card{background:var(--panel);border-radius:12px;padding:16px;margin-bottom:16px}
    .grid{display:grid;grid-template-columns:1fr 170px;gap:10px;align-items:center}
    .label{font-weight:800}
    .money{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #2d2d2d;
      background:#0e0e0e;color:var(--ink);font-size:1rem}
    .hint{margin-top:6px;font-size:.85rem;opacity:.8}
    .row{margin:18px 0}
    .rowtop{display:flex;justify-content:space-between;align-items:end;margin-bottom:4px}
    .value{color:var(--accent);font-weight:800}
    input[type="range"]{width:100%}
    .muted{opacity:.75;font-weight:600}
    .ok{border-color:var(--good);color:var(--good)}
    .mid{border-color:var(--warn);color:var(--warn)}
    .low{border-color:var(--bad);color:var(--bad)}
    .btns{display:flex;gap:8px;justify-content:center;margin-top:10px}
    button{padding:9px 12px;border-radius:8px;border:1px solid #2d2d2d;background:#1c1c1c;color:var(--ink);font-weight:800}
    button:disabled{opacity:.55}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Budget Tracker</h1>

    <!-- TOP: TOTAL SPENT -->
    <div id="bubble" class="bubble">
      <span>
        <span class="sub">Total</span>
        <span id="total">$0</span>
      </span>
    </div>
    <div class="remain">
      Remaining: <strong id="remaining">$0</strong>
    </div>

    <!-- INCOME -->
    <div class="card">
      <div class="grid">
        <div class="label">Monthly Income (set this first)</div>
        <input id="income" class="money" type="number" inputmode="decimal" min="0" step="1" placeholder="e.g. 3000"/>
      </div>
      <div id="gate" class="hint">Enter your income to unlock the sliders.</div>
    </div>

    <!-- SLIDERS -->
    <div class="card" id="catsCard">
      <div class="row">
        <div class="rowtop"><div class="label">Food</div><div class="value" id="foodV">$0</div></div>
        <input type="range" id="food" min="0" max="100" step="1" value="0" disabled>
      </div>

      <div class="row">
        <div class="rowtop"><div class="label">Transport</div><div class="value" id="transportV">$0</div></div>
        <input type="range" id="transport" min="0" max="100" step="1" value="0" disabled>
      </div>

      <div class="row">
        <div class="rowtop"><div class="label">Entertainment</div><div class="value" id="entertainmentV">$0</div></div>
        <input type="range" id="entertainment" min="0" max="100" step="1" value="0" disabled>
      </div>

      <div class="row">
        <div class="rowtop"><div class="label">Savings</div><div class="value" id="savingsV">$0</div></div>
        <input type="range" id="savings" min="0" max="100" step="1" value="0" disabled>
      </div>

      <div class="muted">If a slider would push the total above your income, the other sliders automatically decrease to keep the total within the budget.</div>
      <div class="btns">
        <button id="reset">Reset</button>
        <button id="even">Even split</button>
      </div>
    </div>
  </div>

  <script>
    const CATS = ["food","transport","entertainment","savings"];
    const LS = "budget-auto-redistribute-v1";

    const $ = id => document.getElementById(id);
    const incomeEl = $("income");
    const gateEl = $("gate");
    const totalEl = $("total");
    const remainingEl = $("remaining");
    const bubble = $("bubble");
    const resetBtn = $("reset");
    const evenBtn = $("even");

    const sliders = Object.fromEntries(CATS.map(c => [c, $(c)]));
    const reads   = Object.fromEntries(CATS.map(c => [c, $(c+"V")]));

    const fmt = n => "$" + (Math.round(n) || 0);
    const sum = () => CATS.reduce((a,c)=>a + int(sliders[c].value), 0);
    const int = v => parseInt(v || "0", 10);

    function setEnabled(on){
      CATS.forEach(c => sliders[c].disabled = !on);
      gateEl.textContent = on ? "Sliders are live. Total will always stay within your income." :
                                "Enter your income to unlock the sliders.";
    }

    function colorBubble(rem, inc){
      bubble.classList.remove("ok","mid","low");
      if(!inc){ bubble.classList.add("ok"); return; }
      const p = rem/inc;
      if(p >= .5) bubble.classList.add("ok");
      else if(p >= .2) bubble.classList.add("mid");
      else bubble.classList.add("low");
    }

    // Reduce other sliders proportionally until overflow is gone
    function redistributeOverflow(activeId, income){
      let overflow = sum() - income;
      if (overflow <= 0) return;

      // Safety: loop up to N passes to handle flooring
      let passes = 0;
      while (overflow > 0 && passes < 6){
        passes++;

        // Eligible sliders: others with value > 0
        const others = CATS.filter(c => c !== activeId && int(sliders[c].value) > 0);
        if (others.length === 0){
          // nothing to take from; clamp active
          const allowed = Math.max(0, income - (sum() - int(sliders[activeId].value)));
          sliders[activeId].value = allowed;
          overflow = 0;
          break;
        }

        const totalOthers = others.reduce((a,c)=>a + int(sliders[c].value), 0);
        if (totalOthers === 0){
          // same as above—clamp active
          const allowed = Math.max(0, income - (sum() - int(sliders[activeId].value)));
          sliders[activeId].value = allowed;
          overflow = 0;
          break;
        }

        // Distribute the amount to subtract proportionally
        let removedThisPass = 0;
        others.forEach(c=>{
          if (overflow <= 0) return;
          const current = int(sliders[c].value);
          const share = Math.max(1, Math.floor(overflow * (current / totalOthers))); // at least 1 to make progress
          const newVal = Math.max(0, current - share);
          const actuallyRemoved = current - newVal;
          sliders[c].value = newVal;
          removedThisPass += actuallyRemoved;
        });
        overflow = Math.max(0, overflow - removedThisPass);
      }
    }

    function updateUI(activeId=null){
      const income = int(incomeEl.value);
      setEnabled(income > 0);

      if(income > 0 && activeId){
        // if moving one slider caused sum to exceed income, pull others down
        if (sum() > income) redistributeOverflow(activeId, income);
      } else if (income === 0){
        // zero income -> force all zeros
        CATS.forEach(c => sliders[c].value = 0);
      }

      CATS.forEach(c => reads[c].textContent = fmt(sliders[c].value));
      const t = sum();
      const rem = Math.max(0, income - t);

      totalEl.textContent = fmt(t);
      remainingEl.textContent = fmt(rem);
      colorBubble(rem, income);

      save();
    }

    function save(){
      const data = {
        income: int(incomeEl.value),
        values: Object.fromEntries(CATS.map(c => [c, int(sliders[c].value)]))
      };
      localStorage.setItem(LS, JSON.stringify(data));
    }

    function load(){
      const raw = localStorage.getItem(LS);
      if(!raw) return;
      try{
        const d = JSON.parse(raw);
        if(Number.isFinite(d.income)) incomeEl.value = d.income;
        if(d.values) CATS.forEach(c=>{
          if(Number.isFinite(d.values[c])) sliders[c].value = d.values[c];
        });
      }catch{}
    }

    function resetAll(){
      incomeEl.value = "";
      CATS.forEach(c=> sliders[c].value = 0);
      localStorage.removeItem(LS);
      updateUI();
    }

    function evenSplit(){
      const income = int(incomeEl.value);
      if(!income) return;
      const each = Math.floor(income / CATS.length);
      let used = 0;
      CATS.forEach((c,i)=>{
        const v = (i === CATS.length-1) ? income - used : each;
        sliders[c].value = Math.max(0, v);
        used += int(sliders[c].value);
      });
      updateUI();
    }

    // events
    incomeEl.addEventListener("input", ()=> updateUI());
    CATS.forEach(c => sliders[c].addEventListener("input", ()=> updateUI(c)));
    resetBtn.addEventListener("click", resetAll);
    evenBtn.addEventListener("click", evenSplit);

    // init
    load();
    updateUI();
  </script>
</body>
</html>
