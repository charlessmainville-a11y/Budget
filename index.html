<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Daft Budget — Neon Ledger</title>
<style>
  :root{
    --bg:#05060b;
    --panel:#0b0f1a;
    --accent:#00e5ff;
    --accent2:#ff00f7;
    --ok:#32ffa6;
    --warn:#ffd400;
    --danger:#ff3b3b;
    --chrome:#bfc7d5;
    --grid:#0a1326;
    --text:#dfe7ff;
    --muted:#8ea2c7;
    --glowA: 0 0 12px var(--accent), 0 0 32px var(--accent2);
    --glowSoft: 0 0 10px rgba(0,229,255,.25), 0 0 30px rgba(255,0,247,.15);
  }
  * { box-sizing: border-box }
  html, body { height:100% }
  body{
    margin:0; background: radial-gradient(1200px 800px at 50% -200px, #10172a 0%, #05060b 60%, #020307 100%);
    color:var(--text); font: 16px/1.35 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    overflow:hidden;
  }

  /* Neon grid floor (Daft Punk-ish) */
  .grid{
    position:fixed; inset:0; pointer-events:none; z-index:0;
  }
  .grid:before, .grid:after{
    content:""; position:absolute; left:0; right:0; bottom:-40%;
    height:120%; background:
      linear-gradient(transparent 98%, rgba(0,229,255,.35) 99%) 0 0/100% 40px,
      linear-gradient(90deg, transparent 98%, rgba(255,0,247,.35) 99%) 0 0/40px 100%;
    transform: perspective(900px) rotateX(65deg) translateZ(0);
    filter: drop-shadow(0 0 6px rgba(0,229,255,.4));
  }
  .grid:after{
    bottom:auto; top:-65%;
    height:70%;
    background:
      radial-gradient(ellipse at center, rgba(255,0,247,.12), transparent 60%),
      radial-gradient(ellipse at center, rgba(0,229,255,.10), transparent 70%);
    transform:none; filter:none;
  }

  /* Top chrome header */
  header{
    position:relative; z-index:3;
    display:flex; align-items:center; gap:16px;
    padding:14px 18px 12px 18px;
    background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
    border-bottom: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 2px 24px rgba(0,0,0,.45), inset 0 -1px 0 rgba(255,255,255,.06);
    backdrop-filter: blur(6px);
  }
  .badge{
    padding:4px 10px; border:1px solid rgba(255,255,255,.15); border-radius:999px;
    text-transform:uppercase; letter-spacing:.12em; font-size:12px; color:var(--chrome);
    box-shadow: var(--glowSoft);
  }
  h1{ margin:0; font-size:18px; font-weight:700; color:var(--text); text-shadow: 0 0 6px rgba(0,229,255,.25) }
  .spacer{ flex:1 }
  .mini{
    display:flex; gap:8px; align-items:center; color:var(--muted); font-size:13px;
  }
  .dot{width:6px; height:6px; border-radius:50%; background:var(--ok); box-shadow:0 0 10px var(--ok)}
  .toggle{ appearance:none; width:44px; height:24px; border-radius:999px; border:1px solid rgba(255,255,255,.15); position:relative; outline:none; cursor:pointer; background:#0e1424 }
  .toggle:before{ content:""; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:linear-gradient(180deg,#fff,#cfd8ea); box-shadow: 0 1px 2px rgba(0,0,0,.4) }
  .toggle:checked{ background: linear-gradient(90deg, var(--accent), var(--accent2)) }
  .toggle:checked:before{ transform: translateX(20px) }

  /* Muse (guitar girl) */
  .muse{
    position:absolute; z-index:2; top:62px; left:50%; transform:translateX(-50%);
    width:min(280px, 40vw); opacity:.85; pointer-events:none;
    filter: drop-shadow(0 8px 24px rgba(0,229,255,.25)) saturate(1.1) contrast(1.05);
    animation: float 6s ease-in-out infinite;
  }
  @keyframes float{ 0%,100%{ transform:translateX(-50%) translateY(0)} 50%{ transform:translateX(-50%) translateY(-6px)} }

  /* App layout */
  .wrap{ position:relative; z-index:1; height:100%; padding:96px 18px 18px; display:grid; grid-template-columns: 360px 1fr; gap:18px }
  @media (max-width: 980px){ .wrap{ grid-template-columns: 1fr; padding-top:140px } .muse{ width:min(220px, 55vw)} }

  .panel{
    background: linear-gradient(180deg, rgba(7,11,22,.9), rgba(8,10,18,.7));
    border:1px solid rgba(255,255,255,.10);
    border-radius:14px; padding:14px; box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 10px 40px rgba(0,0,0,.5);
  }
  .title{ display:flex; align-items:center; gap:10px; margin:2px 0 10px; font-weight:700; letter-spacing:.02em }
  .title .glow{ color:var(--accent); text-shadow: var(--glowA) }

  .row{ display:flex; align-items:center; gap:8px; margin:8px 0 }
  .row input, .row select{
    flex:1; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.12);
    background:#0d1324; color:var(--text); outline:none;
  }
  button{
    padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.12);
    background: linear-gradient(180deg, #142243, #0f1a36);
    color:var(--text); cursor:pointer; font-weight:600;
    box-shadow: var(--glowSoft);
  }
  button.primary{ background: linear-gradient(90deg, var(--accent), var(--accent2)); color:#00121a; text-shadow:0 1px 0 rgba(255,255,255,.4) }
  button:disabled{ opacity:.6; cursor:not-allowed }

  /* Stats bar */
  .stats{
    display:grid; grid-template-columns: repeat(3,1fr); gap:8px; margin-top:8px;
  }
  .card{
    background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.10); border-radius:12px; padding:12px;
  }
  .label{ font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.14em }
  .value{ margin-top:6px; font-size:22px; font-weight:800 }
  .value.ok{ color:var(--ok)} .value.warn{ color:var(--warn)} .value.danger{ color:var(--danger)}

  /* Bills list */
  .list{ display:flex; flex-direction:column; gap:8px; margin-top:10px; max-height:40vh; overflow:auto; padding-right:4px }
  .bill{
    display:grid; grid-template-columns: 1fr auto auto; gap:10px; align-items:center;
    background: linear-gradient(180deg, rgba(2,10,24,.8), rgba(8,14,28,.6));
    border:1px solid rgba(255,255,255,.10); border-radius:12px; padding:10px;
  }
  .bill .name{ font-weight:700 }
  .chip{ font-size:12px; padding:4px 8px; border-radius:999px; border:1px solid rgba(255,255,255,.15); color:var(--muted) }
  .bill .amt{ font-weight:800 }
  .bill button{ padding:8px 10px }
  .lock{ color:#9fb0d6 }
  .edit{ color:#0ef; border-color: rgba(0,229,255,.4) }

  /* Canvas for fun neon pulse */
  #viz{ width:100%; height:240px; display:block; border-radius:12px; background:#070c18; border:1px solid rgba(255,255,255,.08) }
  .footer{ position:fixed; bottom:8px; left:0; right:0; text-align:center; color:var(--muted); font-size:12px; pointer-events:none }
</style>
</head>
<body>
  <div class="grid"></div>

  <header>
    <span class="badge">Neon Ledger</span>
    <h1>Budget ✦ <span class="glow">Daft-mode</span></h1>
    <div class="spacer"></div>
    <div class="mini"><span class="dot"></span> <span id="vibeStatus">Haptics ready</span></div>
    <label class="mini">Vibrate
      <input id="vibeToggle" type="checkbox" class="toggle" checked />
    </label>
  </header>

  <!-- Muse image (replace src in JS below if you like) -->
  <img id="muse" class="muse" alt="Daft Punk guitar girl" />

  <main class="wrap">
    <!-- Left: controls -->
    <section class="panel">
      <div class="title">⚡ Add Expense</div>
      <div class="row">
        <input id="expName" placeholder="e.g., Groceries" />
      </div>
      <div class="row">
        <input id="expAmt" type="number" min="0" step="0.01" placeholder="Amount" />
        <select id="expType">
          <option value="variable">Variable</option>
          <option value="bill">Bill (locked unless edited)</option>
        </select>
      </div>
      <div class="row">
        <button id="addBtn" class="primary">Add</button>
        <button id="resetBtn">Reset</button>
      </div>

      <div class="title" style="margin-top:14px;">🎛️ Income / Budget</div>
      <div class="row">
        <input id="income" type="number" min="0" step="0.01" placeholder="Monthly income" />
        <button id="setIncome" class="primary">Set</button>
      </div>

      <div class="stats">
        <div class="card">
          <div class="label">Income</div>
          <div id="valIncome" class="value">$0.00</div>
        </div>
        <div class="card">
          <div class="label">Spent</div>
          <div id="valSpent" class="value">$0.00</div>
        </div>
        <div class="card">
          <div class="label">Remaining</div>
          <div id="valRemain" class="value ok">$0.00</div>
        </div>
      </div>
    </section>

    <!-- Right: visualization + list -->
    <section class="panel">
      <div class="title">🎚️ Neon Pulse</div>
      <canvas id="viz" width="1200" height="360"></canvas>

      <div class="title" style="margin-top:12px;">📜 Ledger</div>
      <div id="list" class="list"></div>
    </section>
  </main>

  <div class="footer">Bills cannot be reduced unless you open & edit that specific bill • Over-budget drains money until corrected • Vibrates every $5 spent</div>

<script>
/* ===========================
   CONFIG
=========================== */
const MUSE_IMG_URL = "daftpunk_girl.png"; // <- Replace with your image path or URL

/* ===========================
   STATE
=========================== */
let income = 0;
let expenses = []; // {id, name, amount, type:'bill'|'variable'}
let spent = 0;
let remain = 0;
let overBudgetDrain = 0.15; // dollars per second when over budget
let lastTick = performance.now();
let cumulativeFiveBuzz = 0; // how many $5 thresholds we’ve crossed
let hapticsOn = true;

/* ===========================
   DOM
=========================== */
const museEl = document.getElementById('muse');
museEl.src = MUSE_IMG_URL;

const expName = document.getElementById('expName');
const expAmt  = document.getElementById('expAmt');
const expType = document.getElementById('expType');
const addBtn  = document.getElementById('addBtn');
const resetBtn= document.getElementById('resetBtn');

const incomeInput = document.getElementById('income');
const setIncomeBtn= document.getElementById('setIncome');

const valIncome = document.getElementById('valIncome');
const valSpent  = document.getElementById('valSpent');
const valRemain = document.getElementById('valRemain');
const list      = document.getElementById('list');

const vibeToggle  = document.getElementById('vibeToggle');
const vibeStatus  = document.getElementById('vibeStatus');

/* ===========================
   HAPTICS
=========================== */
function canVibrate(){ return 'vibrate' in navigator; }
function vibrate(pattern){
  if(!hapticsOn || !canVibrate()) return;
  try{ navigator.vibrate(pattern); }catch(e){}
}
function buzzTap(){ vibrate(20); }
function buzzConfirm(){ vibrate([30, 30, 30]); }
function buzzError(){ vibrate([80, 40, 80]); }

/* Buzz every $5 spent (cumulative) */
function checkFiveBuzz(){
  const thresholdsCrossed = Math.floor(spent / 5);
  if(thresholdsCrossed > cumulativeFiveBuzz){
    const diff = thresholdsCrossed - cumulativeFiveBuzz;
    cumulativeFiveBuzz = thresholdsCrossed;
    // one sharp buzz per threshold crossed
    for(let i=0;i<diff;i++){
      setTimeout(()=>vibrate([0, 50]), 120*i);
    }
  }
}

/* ===========================
   RENDER
=========================== */
function fmt(n){ return `$${(n||0).toFixed(2)}`; }

function recalc(){
  spent = expenses.reduce((a,e)=> a + e.amount, 0);
  remain = income - spent;
  valIncome.textContent = fmt(income);
  valSpent.textContent  = fmt(spent);
  valRemain.textContent = fmt(remain);

  valRemain.classList.remove('ok','warn','danger');
  if(remain >= income * 0.4) valRemain.classList.add('ok');
  else if(remain >= 0)       valRemain.classList.add('warn');
  else                       valRemain.classList.add('danger');

  checkFiveBuzz();
  drawViz();
}

function renderList(){
  list.innerHTML = '';
  if(expenses.length === 0){
    const empty = document.createElement('div');
    empty.className = 'card';
    empty.textContent = 'No expenses yet.';
    list.appendChild(empty);
    return;
  }
  expenses.forEach(e=>{
    const row = document.createElement('div');
    row.className = 'bill';

    const left = document.createElement('div');
    left.innerHTML = `<div class="name">${e.name}</div>
                      <div class="chip">${e.type === 'bill' ? 'Bill • Locked' : 'Variable'}</div>`;

    const amt = document.createElement('div');
    amt.className = 'amt';
    amt.textContent = fmt(e.amount);

    const actions = document.createElement('div');
    const edit = document.createElement('button');
    edit.className = 'edit';
    edit.textContent = 'Edit';
    edit.addEventListener('click', ()=>{
      const v = prompt(`Edit ${e.name} amount (${e.type==='bill'?'bill is locked except here':''})`, e.amount.toString());
      if(v == null) return;
      const num = parseFloat(v);
      if(Number.isNaN(num) || num < 0){ buzzError(); return; }
      // Rule: bills cannot be reduced unless directly interacted — this IS direct interaction,
      // so allow both increase and decrease. We’ll prevent programmatic/global decreases elsewhere.
      e.amount = num;
      buzzConfirm();
      recalc(); renderList();
    });

    const inc = document.createElement('button');
    inc.textContent = '+$';
    inc.addEventListener('click', ()=>{
      e.amount = +(e.amount + 1).toFixed(2);
      buzzTap(); recalc(); renderList();
    });

    const dec = document.createElement('button');
    dec.textContent = '-$';
    dec.addEventListener('click', ()=>{
      // Prevent blanket decreases for bills unless it’s via this button
      // (this IS a direct interaction, so it’s allowed)
      e.amount = Math.max(0, +(e.amount - 1).toFixed(2));
      buzzTap(); recalc(); renderList();
    });

    const del = document.createElement('button');
    del.textContent = 'Delete';
    del.addEventListener('click', ()=>{
      expenses = expenses.filter(x=> x.id !== e.id);
      buzzError(); recalc(); renderList();
    });

    actions.append(edit, inc, dec, del);
    row.append(left, amt, actions);
    list.appendChild(row);
  });
}

/* ===========================
   LOGIC
=========================== */
/* Add expense */
addBtn.addEventListener('click', ()=>{
  const name = (expName.value || '').trim();
  const amt  = parseFloat(expAmt.value);
  const type = expType.value;
  if(!name || Number.isNaN(amt) || amt < 0){ buzzError(); return; }
  expenses.push({ id: crypto.randomUUID(), name, amount: +amt.toFixed(2), type });
  expName.value = ''; expAmt.value = '';
  buzzConfirm();
  recalc(); renderList();
});

/* Reset */
resetBtn.addEventListener('click', ()=>{
  if(!confirm('Reset everything?')) return;
  expenses = []; income = 0; cumulativeFiveBuzz = 0;
  buzzError(); recalc(); renderList();
});

/* Set income */
setIncomeBtn.addEventListener('click', ()=>{
  const v = parseFloat(incomeInput.value);
  if(Number.isNaN(v) || v < 0){ buzzError(); return; }
  income = +v.toFixed(2);
  buzzConfirm(); recalc();
});

/* Haptics toggle */
vibeToggle.addEventListener('change', (e)=>{
  hapticsOn = e.target.checked;
  vibeStatus.textContent = hapticsOn ? 'Haptics ready' : 'Haptics off';
  if(hapticsOn) buzzTap();
});

/* Prevent programmatic/global decreases for bills:
   (Only edits via the bill’s own controls can change them) */
function setBillAmount(id, newAmt){
  // Intentionally unused helper to centralize logic if you expand later
  const b = expenses.find(x=> x.id === id && x.type === 'bill');
  if(!b) return;
  b.amount = Math.max(0, +newAmt.toFixed(2));
}

/* Over-budget drain: “lose money if I’m over budget” */
function tick(now){
  const dt = (now - lastTick) / 1000;
  lastTick = now;
  if(remain < 0){
    // drain increases slightly with how deep you are over budget
    const intensity = Math.min(3, Math.max(1, Math.abs(remain)/50));
    const drain = overBudgetDrain * intensity * dt;
    // Apply as a virtual “interest fee” entry that we fold into spent
    // (we don’t add a line item, we just increase a hidden sink)
    spent += drain;
    remain -= drain;
    // angry buzz pulse while over
    if(Math.random() < 0.05) vibrate([40, 40, 40]);
    updateStatsOnly();
    drawViz(true);
  }
  requestAnimationFrame(tick);
}
function updateStatsOnly(){
  valSpent.textContent  = fmt(spent);
  valRemain.textContent = fmt(remain);
  valRemain.classList.remove('ok','warn','danger');
  if(remain >= income * 0.4) valRemain.classList.add('ok');
  else if(remain >= 0)       valRemain.classList.add('warn');
  else                       valRemain.classList.add('danger');
}

/* ===========================
   VIZ (neon bars)
=========================== */
const canvas = document.getElementById('viz');
const ctx = canvas.getContext('2d');

function drawViz(angry=false){
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);

  // background gradient
  const g = ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0, '#0a1227');
  g.addColorStop(1, '#060a17');
  ctx.fillStyle = g; ctx.fillRect(0,0,w,h);

  // bars
  const n = 36;
  const t = performance.now() / 1000;
  for(let i=0;i<n;i++){
    const x = (i+1) * (w/(n+1));
    const f = Math.sin(t*2 + i*0.4)*0.5 + 0.5;
    // height responds to spend/remaining balance
    const pressure = Math.min(1.6, Math.max(.2, (spent/(income||1))*0.9 + (remain<0 ? 0.6 : 0)));
    const barH = (h*0.12 + f*h*0.25) * pressure;
    const y = h - barH;
    const grad = ctx.createLinearGradient(0,y,0,h);
    grad.addColorStop(0, angry? '#ff375f' : '#00e5ff');
    grad.addColorStop(1, angry? '#ff00f7' : '#6a00ff');
    ctx.fillStyle = grad;
    ctx.shadowColor = angry? 'rgba(255,0,90,.8)' : 'rgba(0,229,255,.7)';
    ctx.shadowBlur = angry? 22 : 16;
    ctx.fillRect(x-6, y, 12, barH);
  }

  // horizon line
  ctx.shadowBlur = 0;
  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = 'rgba(255,255,255,.08)';
  ctx.beginPath();
  ctx.moveTo(0, h*0.12);
  ctx.lineTo(w, h*0.12);
  ctx.stroke();

  // labels
  ctx.fillStyle = '#9fb0d6';
  ctx.font = '12px system-ui, -apple-system, Segoe UI, Roboto, Arial';
  ctx.fillText(`Spent: ${fmt(spent)} • Income: ${fmt(income)} • Remaining: ${fmt(remain)}`, 12, 20);
}

/* ===========================
   INIT
=========================== */
function init(){
  if(!canVibrate()){
    vibeStatus.textContent = 'Haptics not supported';
    vibeToggle.checked = false; hapticsOn = false;
  }
  renderList();
  recalc();
  lastTick = performance.now();
  requestAnimationFrame(tick);

  // Resize canvas to element size
  function fit(){
    const rect = canvas.getBoundingClientRect();
    const ratio = window.devicePixelRatio || 1;
    canvas.width  = Math.floor(rect.width * ratio);
    canvas.height = Math.floor(240 * ratio);
    canvas.style.height = '240px';
    drawViz();
  }
  fit(); window.addEventListener('resize', fit);
}
init();
</script>
</body>
</html>
