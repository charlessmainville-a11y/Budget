<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Dead-Simple Browser Music App</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --card: #171a21;
      --text: #f5f7ff;
      --muted: #a8b0c3;
      --accent: #70a5ff;
      --accent-2: #4f83e2;
      --danger: #dd5555;
      --danger-2: #b54242;
      --border: #2a2f3b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, #1b2130, var(--bg) 60%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .app {
      width: min(720px, 100%);
      background: color-mix(in oklab, var(--card) 92%, black);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,.35);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.15rem;
      font-weight: 700;
      text-align: center;
    }

    textarea {
      width: 100%;
      min-height: 170px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #0f1320;
      color: var(--text);
      font: 600 1rem/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      padding: 12px;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(112, 165, 255, 0.2);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      border: 0;
      border-radius: 10px;
      color: white;
      font-weight: 700;
      font-size: 1rem;
      padding: 12px 16px;
      min-width: 90px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #playBtn { background: var(--accent); }
    #playBtn:active { background: var(--accent-2); }
    #stopBtn { background: var(--danger); }
    #stopBtn:active { background: var(--danger-2); }

    .bpm {
      display: grid;
      gap: 6px;
      flex: 1;
      min-width: 220px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      background: #111622;
    }

    .row {
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
      color: var(--muted);
    }

    input[type="range"] {
      width: 100%;
      touch-action: pan-x;
    }

    .step {
      margin-top: 10px;
      text-align: center;
      color: var(--muted);
      font: 700 0.95rem/1.4 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      min-height: 1.4em;
    }

    .tip {
      margin-top: 10px;
      color: var(--muted);
      font-size: .9rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Dead-Simple Browser Music App</h1>

    <textarea id="patternInput" spellcheck="false">kick: x---x---x---x---
snare: ----x-------x---
hat: x-x-x-x-x-x-x-x-</textarea>

    <div class="controls">
      <button id="playBtn" type="button">Play</button>
      <button id="stopBtn" type="button">Stop</button>

      <label class="bpm" for="bpmSlider">
        <div class="row">
          <span>BPM</span>
          <strong id="bpmValue">120</strong>
        </div>
        <input id="bpmSlider" type="range" min="60" max="160" value="120" step="1" />
      </label>
    </div>

    <div id="stepIndicator" class="step">step: -</div>
    <div class="tip">x = play · - = silence · 16 steps (16th notes)</div>
  </main>

  <script>
    (() => {
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const lookaheadMs = 25;
      const scheduleAheadSec = 0.12;

      const patternInput = document.getElementById('patternInput');
      const playBtn = document.getElementById('playBtn');
      const stopBtn = document.getElementById('stopBtn');
      const bpmSlider = document.getElementById('bpmSlider');
      const bpmValue = document.getElementById('bpmValue');
      const stepIndicator = document.getElementById('stepIndicator');

      let isPlaying = false;
      let schedulerId = null;
      let currentStep = 0;
      let nextNoteTime = 0;
      let parsedPattern = {};

      function parsePattern(text) {
        const out = {};
        const lines = text.split('\n').map((l) => l.trim()).filter(Boolean);

        for (const line of lines) {
          const parts = line.split(':');
          if (parts.length < 2) continue;

          const name = parts[0].trim().toLowerCase();
          const raw = parts.slice(1).join(':').replace(/\s+/g, '');
          const pattern = raw.slice(0, 16).padEnd(16, '-');
          out[name] = [...pattern].map((ch) => ch === 'x');
        }

        return out;
      }

      function stepDurationSec() {
        const bpm = Number(bpmSlider.value);
        return 60 / bpm / 4; // 16th note
      }

      function updateBpmLabel() {
        bpmValue.textContent = bpmSlider.value;
      }

      function makeNoiseBuffer() {
        const duration = 0.2;
        const length = Math.floor(audioContext.sampleRate * duration);
        const buffer = audioContext.createBuffer(1, length, audioContext.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < length; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        return buffer;
      }

      const noiseBuffer = makeNoiseBuffer();

      function playKick(time) {
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(140, time);
        osc.frequency.exponentialRampToValueAtTime(45, time + 0.12);

        gain.gain.setValueAtTime(1, time);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.12);

        osc.connect(gain);
        gain.connect(audioContext.destination);

        osc.start(time);
        osc.stop(time + 0.13);
      }

      function playSnare(time) {
        const noise = audioContext.createBufferSource();
        const noiseFilter = audioContext.createBiquadFilter();
        const noiseGain = audioContext.createGain();

        noise.buffer = noiseBuffer;
        noiseFilter.type = 'highpass';
        noiseFilter.frequency.setValueAtTime(1200, time);

        noiseGain.gain.setValueAtTime(0.9, time);
        noiseGain.gain.exponentialRampToValueAtTime(0.0001, time + 0.16);

        noise.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(audioContext.destination);

        noise.start(time);
        noise.stop(time + 0.2);
      }

      function playHat(time) {
        const noise = audioContext.createBufferSource();
        const filter = audioContext.createBiquadFilter();
        const gain = audioContext.createGain();

        noise.buffer = noiseBuffer;
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(7000, time);

        gain.gain.setValueAtTime(0.28, time);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.045);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioContext.destination);

        noise.start(time);
        noise.stop(time + 0.05);
      }

      function triggerStep(step, time) {
        if (parsedPattern.kick && parsedPattern.kick[step]) playKick(time);
        if (parsedPattern.snare && parsedPattern.snare[step]) playSnare(time);
        if (parsedPattern.hat && parsedPattern.hat[step]) playHat(time);
      }

      function scheduleStep() {
        while (nextNoteTime < audioContext.currentTime + scheduleAheadSec) {
          triggerStep(currentStep, nextNoteTime);
          const shownStep = currentStep;
          setTimeout(() => {
            stepIndicator.textContent = `step: ${shownStep + 1} / 16`;
          }, Math.max(0, (nextNoteTime - audioContext.currentTime) * 1000));

          nextNoteTime += stepDurationSec();
          currentStep = (currentStep + 1) % 16;
        }
      }

      async function start() {
        parsedPattern = parsePattern(patternInput.value);
        if (audioContext.state === 'suspended') {
          await audioContext.resume();
        }
        if (isPlaying) return;

        isPlaying = true;
        currentStep = 0;
        nextNoteTime = audioContext.currentTime + 0.03;
        schedulerId = setInterval(scheduleStep, lookaheadMs);
      }

      function stop() {
        isPlaying = false;
        if (schedulerId !== null) {
          clearInterval(schedulerId);
          schedulerId = null;
        }
        stepIndicator.textContent = 'step: -';
      }

      playBtn.addEventListener('click', start);
      stopBtn.addEventListener('click', stop);

      bpmSlider.addEventListener('input', updateBpmLabel);
      updateBpmLabel();
    })();
  </script>
</body>
</html>
