<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget Tracker</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 20px;
      background: #111;
      color: #f5f5f5;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    .category {
      margin: 20px 0;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }
    input[type="range"] {
      width: 100%;
    }
    .value {
      font-weight: bold;
      margin-left: 10px;
      color: #6cf;
    }
    #total {
      margin-top: 30px;
      text-align: center;
      font-size: 1.5em;
      color: lime;
    }
  </style>
</head>
<body>
  <h1>Budget Tracker</h1>
  <div id="categories"></div>
  <div id="total">Total: $0</div>

  <script>
    // categories to track
    const categories = ["Food", "Transport", "Entertainment", "Savings"];
    const container = document.getElementById("categories");
    const totalDisplay = document.getElementById("total");

    // Load saved data from localStorage
    let savedBudget = JSON.parse(localStorage.getItem("budgetData")) || {};

    // Build sliders
    categories.forEach(cat => {
      const div = document.createElement("div");
      div.className = "category";

      const label = document.createElement("label");
      label.innerText = cat + ": ";
      
      const span = document.createElement("span");
      span.className = "value";
      span.id = cat + "-value";
      span.innerText = "$" + (savedBudget[cat] || 0);

      label.appendChild(span);
      div.appendChild(label);

      const input = document.createElement("input");
      input.type = "range";
      input.min = 0;
      input.max = 100;
      input.value = savedBudget[cat] || 0;

      input.addEventListener("input", () => {
        span.innerText = "$" + input.value;
        savedBudget[cat] = parseInt(input.value);
        localStorage.setItem("budgetData", JSON.stringify(savedBudget));
        updateTotal();
      });

      div.appendChild(input);
      container.appendChild(div);
    });

    function updateTotal() {
      const sum = Object.values(savedBudget).reduce((a, b) => a + b, 0);
      totalDisplay.innerText = "Total: $" + sum;
    }

    // Initial render
    updateTotal();
  </script>
</body>
</html>
