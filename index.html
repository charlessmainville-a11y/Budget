<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pocket Groove</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080a11;
      --card: #101526;
      --text: #f2f6ff;
      --muted: #97a2bd;
      --accent: #7ca3ff;
      --accent-soft: rgba(124, 163, 255, 0.25);
      --border: #27304a;
      --active: #9ac0ff;
      --hit: #ffd57a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 30% 0%, #16203a 0%, var(--bg) 55%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .app {
      width: min(860px, 100%);
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.45), 0 0 40px rgba(124, 163, 255, 0.08);
      transition: box-shadow 0.2s ease;
    }

    .app.pulse {
      box-shadow: 0 20px 54px rgba(0, 0, 0, 0.5), 0 0 62px rgba(124, 163, 255, 0.2);
    }

    h1 {
      margin: 0 0 14px;
      text-align: center;
      font-size: 1.2rem;
      letter-spacing: 0.03em;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
      margin-bottom: 14px;
    }

    select, button {
      border: 1px solid var(--border);
      background: #111a30;
      color: var(--text);
      border-radius: 12px;
      padding: 11px 13px;
      font-weight: 600;
      font-size: 0.95rem;
      -webkit-tap-highlight-color: transparent;
    }

    select { min-width: 190px; }

    button {
      min-width: 88px;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.12s ease;
    }

    button:active { transform: scale(0.98); }

    #playBtn { background: #1a356d; }
    #stopBtn { background: #402031; }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(108px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .knob {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px;
      background: rgba(19, 29, 52, 0.7);
      display: grid;
      justify-items: center;
      gap: 6px;
    }

    .knob label {
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .knob strong { font-size: 0.88rem; }

    .knob input[type="range"] {
      width: 72px;
      height: 72px;
      margin: 0;
      accent-color: var(--active);
      touch-action: pan-x;
    }

    .synth-controls {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px;
      margin-bottom: 14px;
      background: rgba(11, 18, 33, 0.8);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
    }

    .field {
      display: grid;
      gap: 6px;
      align-content: start;
    }

    .field label {
      color: var(--muted);
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .field input[type="range"] {
      width: 100%;
      accent-color: var(--active);
      touch-action: pan-x;
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      background: #111a30;
      min-height: 48px;
    }

    .toggle input {
      width: 18px;
      height: 18px;
      accent-color: var(--active);
    }

    .grid {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px;
      background: rgba(11, 18, 33, 0.8);
      display: grid;
      gap: 8px;
    }

    .row {
      display: grid;
      grid-template-columns: 56px repeat(16, minmax(0, 1fr));
      gap: 5px;
      align-items: center;
    }

    .row .name {
      color: var(--muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .step-btn {
      border: 1px solid #2b3757;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 7px;
      background: #121a31;
      padding: 0;
      min-width: 0;
      box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.25);
      transition: background-color 0.12s ease, box-shadow 0.12s ease, transform 0.12s ease;
    }

    .step-btn.on {
      background: linear-gradient(180deg, #6f98ff, #3d63bc);
      box-shadow: 0 0 12px var(--accent-soft);
    }

    .step-btn.current {
      outline: 2px solid var(--hit);
      outline-offset: -1px;
      transform: translateY(-1px);
    }

    .status {
      margin-top: 12px;
      text-align: center;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 0.9rem;
      min-height: 1.35em;
    }

    @media (max-width: 700px) {
      .app { padding: 14px; }
      .row { grid-template-columns: 50px repeat(16, minmax(0, 1fr)); gap: 4px; }
      .synth-controls { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .field select { min-width: 0; width: 100%; }
    }
  </style>
</head>
<body>
  <main class="app" id="appCard">
    <h1>Pocket Groove</h1>

    <div class="toolbar">
      <select id="presetSelect" aria-label="Pattern Preset"></select>
      <button id="playBtn" type="button">Play</button>
      <button id="stopBtn" type="button">Stop</button>
    </div>

    <section class="controls" id="knobArea"></section>

    <section class="synth-controls" aria-label="Synth controls">
      <div class="field">
        <label for="synthScale">Scale</label>
        <select id="synthScale">
          <option value="C major">C major</option>
          <option value="C minor" selected>C minor</option>
          <option value="D minor">D minor</option>
          <option value="A minor">A minor</option>
        </select>
      </div>
      <div class="field">
        <label for="synthPatternMode">Note Pattern</label>
        <select id="synthPatternMode">
          <option value="ascending">Ascending</option>
          <option value="descending">Descending</option>
          <option value="random">Random</option>
          <option value="fixed">Fixed</option>
        </select>
      </div>
      <div class="field">
        <label for="synthWave">Wave</label>
        <select id="synthWave">
          <option value="sine">sine</option>
          <option value="sawtooth" selected>sawtooth</option>
          <option value="square">square</option>
        </select>
      </div>
      <div class="field">
        <label for="synthAttack">Attack <strong id="synthAttackValue">0.02s</strong></label>
        <input type="range" id="synthAttack" min="0" max="1" step="0.01" value="0.02" />
      </div>
      <div class="field">
        <label for="synthDecay">Decay <strong id="synthDecayValue">0.22s</strong></label>
        <input type="range" id="synthDecay" min="0" max="1" step="0.01" value="0.22" />
      </div>
      <label class="toggle" for="synthBassMode">
        <input type="checkbox" id="synthBassMode" />
        <span>Bass Mode</span>
      </label>
    </section>

    <section class="grid" id="stepGrid" aria-label="Step sequencer grid"></section>

    <div id="stepStatus" class="status">step: -</div>
  </main>

  <script>
    (() => {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const audioContext = new AudioCtx();
      const lookaheadMs = 25;
      const scheduleAheadSec = 0.14;
      const drumTracks = ['kick', 'snare', 'hat'];
      const tracks = [...drumTracks, 'synth'];
      const steps = 16;

      const scaleMap = {
        'C major': [60, 62, 64, 65, 67, 69, 71, 72],
        'C minor': [60, 62, 63, 65, 67, 68, 70, 72],
        'D minor': [62, 64, 65, 67, 69, 70, 72, 74],
        'A minor': [57, 59, 60, 62, 64, 65, 67, 69]
      };

      const presets = {
        'Basic Groove': {
          kick: 'x---x---x---x---',
          snare: '----x-------x---',
          hat: 'x-x-x-x-x-x-x-x-',
          synth: 'x-------x-------'
        },
        'Slow Chill': {
          kick: 'x-------x---x---',
          snare: '--------x-------',
          hat: 'x---x---x---x---',
          synth: 'x---x-------x---'
        },
        'Fast Techno': {
          kick: 'x-x-xx-x-x-xx-x-',
          snare: '----x-------x-x-',
          hat: 'xxxxxxxxxxxxxxxx',
          synth: 'x-xx--x-x-xx--x-'
        },
        'Sparse Beat': {
          kick: 'x-------x-------',
          snare: '--------x-------',
          hat: '--x-----x-----x-',
          synth: '--x---------x---'
        }
      };

      const controlsSpec = [
        { id: 'bpm', label: 'BPM', min: 70, max: 170, value: 120, step: 1 },
        { id: 'volume', label: 'Master', min: 0, max: 1, value: 0.8, step: 0.01 },
        { id: 'bass', label: 'Bass', min: -8, max: 12, value: 4, step: 0.1 },
        { id: 'filter', label: 'Filter', min: 400, max: 14000, value: 9000, step: 1 },
        { id: 'reverb', label: 'Reverb', min: 0, max: 1, value: 0.2, step: 0.01 },
        { id: 'swing', label: 'Swing', min: 0, max: 0.45, value: 0.08, step: 0.01 }
      ];

      const presetSelect = document.getElementById('presetSelect');
      const playBtn = document.getElementById('playBtn');
      const stopBtn = document.getElementById('stopBtn');
      const stepGrid = document.getElementById('stepGrid');
      const stepStatus = document.getElementById('stepStatus');
      const knobArea = document.getElementById('knobArea');
      const appCard = document.getElementById('appCard');
      const synthScale = document.getElementById('synthScale');
      const synthPatternMode = document.getElementById('synthPatternMode');
      const synthWave = document.getElementById('synthWave');
      const synthAttack = document.getElementById('synthAttack');
      const synthDecay = document.getElementById('synthDecay');
      const synthAttackValue = document.getElementById('synthAttackValue');
      const synthDecayValue = document.getElementById('synthDecayValue');
      const synthBassMode = document.getElementById('synthBassMode');

      const values = Object.fromEntries(controlsSpec.map((control) => [control.id, control.value]));
      const pattern = {};
      tracks.forEach((track) => (pattern[track] = Array(steps).fill(false)));

      const synthState = {
        scale: synthScale.value,
        notePattern: synthPatternMode.value,
        wave: synthWave.value,
        attack: Number(synthAttack.value),
        decay: Number(synthDecay.value),
        bassMode: synthBassMode.checked
      };

      let isPlaying = false;
      let schedulerId = null;
      let currentStep = 0;
      let nextNoteTime = 0;

      const masterGain = audioContext.createGain();
      const bassFilter = audioContext.createBiquadFilter();
      const lowPassFilter = audioContext.createBiquadFilter();
      const dryGain = audioContext.createGain();
      const reverbSend = audioContext.createGain();
      const reverbDelay = audioContext.createDelay(0.4);
      const reverbFeedback = audioContext.createGain();
      const reverbWet = audioContext.createGain();

      bassFilter.type = 'lowshelf';
      bassFilter.frequency.value = 170;
      lowPassFilter.type = 'lowpass';
      lowPassFilter.Q.value = 0.8;
      reverbDelay.delayTime.value = 0.16;
      reverbFeedback.gain.value = 0.35;

      bassFilter.connect(lowPassFilter);
      lowPassFilter.connect(dryGain);
      lowPassFilter.connect(reverbSend);
      reverbSend.connect(reverbDelay);
      reverbDelay.connect(reverbFeedback);
      reverbFeedback.connect(reverbDelay);
      reverbDelay.connect(reverbWet);
      dryGain.connect(masterGain);
      reverbWet.connect(masterGain);
      masterGain.connect(audioContext.destination);

      function makeNoiseBuffer() {
        const duration = 0.25;
        const length = Math.floor(audioContext.sampleRate * duration);
        const buffer = audioContext.createBuffer(1, length, audioContext.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
        return buffer;
      }

      const noiseBuffer = makeNoiseBuffer();

      function controlValueText(id, value) {
        if (id === 'bpm') return String(Math.round(value));
        if (id === 'filter') return String(Math.round(value));
        if (id === 'swing' || id === 'reverb' || id === 'volume') return value.toFixed(2);
        return value.toFixed(1);
      }

      function buildControls() {
        knobArea.innerHTML = '';
        controlsSpec.forEach((spec) => {
          const wrapper = document.createElement('label');
          wrapper.className = 'knob';

          const title = document.createElement('label');
          title.textContent = spec.label;

          const input = document.createElement('input');
          input.type = 'range';
          input.min = String(spec.min);
          input.max = String(spec.max);
          input.value = String(spec.value);
          input.step = String(spec.step);
          input.id = `ctl-${spec.id}`;

          const output = document.createElement('strong');
          output.id = `out-${spec.id}`;
          output.textContent = controlValueText(spec.id, spec.value);

          input.addEventListener('input', () => {
            values[spec.id] = Number(input.value);
            output.textContent = controlValueText(spec.id, values[spec.id]);
            applyAudioParams();
          }, { passive: true });

          wrapper.append(title, input, output);
          knobArea.appendChild(wrapper);
        });
      }

      function bindSynthControls() {
        synthScale.addEventListener('change', () => {
          synthState.scale = synthScale.value;
        });
        synthPatternMode.addEventListener('change', () => {
          synthState.notePattern = synthPatternMode.value;
        });
        synthWave.addEventListener('change', () => {
          synthState.wave = synthWave.value;
        });
        synthAttack.addEventListener('input', () => {
          synthState.attack = Number(synthAttack.value);
          synthAttackValue.textContent = `${synthState.attack.toFixed(2)}s`;
        }, { passive: true });
        synthDecay.addEventListener('input', () => {
          synthState.decay = Number(synthDecay.value);
          synthDecayValue.textContent = `${synthState.decay.toFixed(2)}s`;
        }, { passive: true });
        synthBassMode.addEventListener('change', () => {
          synthState.bassMode = synthBassMode.checked;
        });
      }

      function applyAudioParams() {
        masterGain.gain.setTargetAtTime(values.volume, audioContext.currentTime, 0.015);
        bassFilter.gain.setTargetAtTime(values.bass, audioContext.currentTime, 0.02);
        lowPassFilter.frequency.setTargetAtTime(values.filter, audioContext.currentTime, 0.02);
        dryGain.gain.setTargetAtTime(1 - values.reverb * 0.4, audioContext.currentTime, 0.02);
        reverbWet.gain.setTargetAtTime(values.reverb * 0.75, audioContext.currentTime, 0.02);
        reverbSend.gain.setTargetAtTime(values.reverb * 0.55, audioContext.currentTime, 0.02);
      }

      function loadPreset(name) {
        const preset = presets[name];
        tracks.forEach((track) => {
          const source = preset[track] || '-'.repeat(steps);
          const str = source.padEnd(steps, '-').slice(0, steps);
          pattern[track] = [...str].map((ch) => ch === 'x');
        });
        renderGrid();
      }

      function buildPresetMenu() {
        presetSelect.innerHTML = '';
        Object.keys(presets).forEach((name) => {
          const option = document.createElement('option');
          option.value = name;
          option.textContent = name;
          presetSelect.appendChild(option);
        });
        presetSelect.addEventListener('change', () => loadPreset(presetSelect.value));
        presetSelect.value = 'Basic Groove';
      }

      function renderGrid() {
        stepGrid.innerHTML = '';
        tracks.forEach((track) => {
          const row = document.createElement('div');
          row.className = 'row';

          const name = document.createElement('span');
          name.className = 'name';
          name.textContent = track === 'synth' ? 'SYNTH' : track;
          row.appendChild(name);

          for (let i = 0; i < steps; i++) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'step-btn';
            if (pattern[track][i]) btn.classList.add('on');
            btn.dataset.track = track;
            btn.dataset.step = String(i);
            btn.setAttribute('aria-label', `${track} step ${i + 1}`);
            row.appendChild(btn);
          }

          stepGrid.appendChild(row);
        });
      }

      stepGrid.addEventListener('click', (event) => {
        const target = event.target;
        if (!(target instanceof HTMLButtonElement) || !target.classList.contains('step-btn')) return;
        const track = target.dataset.track;
        const step = Number(target.dataset.step);
        if (!track || Number.isNaN(step)) return;
        pattern[track][step] = !pattern[track][step];
        target.classList.toggle('on', pattern[track][step]);
      });

      function connectVoice(node) {
        node.connect(bassFilter);
      }

      function playKick(time) {
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, time);
        osc.frequency.exponentialRampToValueAtTime(46, time + 0.13);
        gain.gain.setValueAtTime(1, time);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.14);
        osc.connect(gain);
        connectVoice(gain);
        osc.start(time);
        osc.stop(time + 0.15);
      }

      function playSnare(time) {
        const noise = audioContext.createBufferSource();
        const hp = audioContext.createBiquadFilter();
        const gain = audioContext.createGain();
        noise.buffer = noiseBuffer;
        hp.type = 'highpass';
        hp.frequency.value = 1400;
        gain.gain.setValueAtTime(0.9, time);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.18);
        noise.connect(hp);
        hp.connect(gain);
        connectVoice(gain);
        noise.start(time);
        noise.stop(time + 0.2);
      }

      function playHat(time) {
        const noise = audioContext.createBufferSource();
        const hp = audioContext.createBiquadFilter();
        const gain = audioContext.createGain();
        noise.buffer = noiseBuffer;
        hp.type = 'highpass';
        hp.frequency.value = 7600;
        gain.gain.setValueAtTime(0.25, time);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.05);
        noise.connect(hp);
        hp.connect(gain);
        connectVoice(gain);
        noise.start(time);
        noise.stop(time + 0.06);
      }

      function midiToFrequency(midi) {
        return 440 * Math.pow(2, (midi - 69) / 12);
      }

      function getSynthMidi(step) {
        const notes = scaleMap[synthState.scale] || scaleMap['C minor'];
        const index = step % notes.length;
        const descendingIndex = notes.length - 1 - index;

        if (synthState.notePattern === 'ascending') return notes[index];
        if (synthState.notePattern === 'descending') return notes[descendingIndex];
        if (synthState.notePattern === 'random') return notes[Math.floor(Math.random() * notes.length)];
        return notes[0];
      }

      function playSynth(step, time) {
        const osc = audioContext.createOscillator();
        const amp = audioContext.createGain();
        const tone = audioContext.createBiquadFilter();
        const baseMidi = getSynthMidi(step);
        const bassShift = synthState.bassMode ? (Math.random() < 0.5 ? 12 : 24) : 0;
        const midi = baseMidi - bassShift;
        const frequency = midiToFrequency(midi);
        const attack = Math.max(0, synthState.attack);
        const decay = Math.max(0.02, synthState.decay);
        const peak = synthState.bassMode ? 0.45 : 0.3;
        const releaseTime = time + attack + decay;

        osc.type = synthState.wave;
        osc.frequency.setValueAtTime(frequency, time);

        tone.type = 'lowpass';
        tone.Q.value = 0.6;
        tone.frequency.setValueAtTime(synthState.bassMode ? 900 : 2400, time);

        amp.gain.setValueAtTime(0.0001, time);
        amp.gain.linearRampToValueAtTime(peak, time + attack + 0.001);
        amp.gain.exponentialRampToValueAtTime(0.0001, releaseTime);

        osc.connect(tone);
        tone.connect(amp);
        connectVoice(amp);
        osc.start(time);
        osc.stop(releaseTime + 0.02);
      }

      function stepDurationSec() {
        return 60 / values.bpm / 4;
      }

      function swingOffsetForStep(step) {
        return step % 2 === 1 ? stepDurationSec() * values.swing : 0;
      }

      function highlightStep(step) {
        const prev = stepGrid.querySelectorAll('.step-btn.current');
        prev.forEach((el) => el.classList.remove('current'));
        stepGrid.querySelectorAll(`.step-btn[data-step="${step}"]`).forEach((el) => el.classList.add('current'));
        stepStatus.textContent = `step: ${step + 1} / 16`;
        appCard.classList.add('pulse');
        setTimeout(() => appCard.classList.remove('pulse'), 110);
      }

      function triggerStep(step, time) {
        if (pattern.kick[step]) playKick(time);
        if (pattern.snare[step]) playSnare(time);
        if (pattern.hat[step]) playHat(time);
        if (pattern.synth[step]) playSynth(step, time);
      }

      function scheduleStep() {
        while (nextNoteTime < audioContext.currentTime + scheduleAheadSec) {
          const step = currentStep;
          const swingTime = nextNoteTime + swingOffsetForStep(step);
          triggerStep(step, swingTime);

          const ms = Math.max(0, (swingTime - audioContext.currentTime) * 1000);
          setTimeout(() => {
            if (isPlaying) highlightStep(step);
          }, ms);

          nextNoteTime += stepDurationSec();
          currentStep = (currentStep + 1) % steps;
        }
      }

      async function start() {
        if (audioContext.state === 'suspended') await audioContext.resume();
        if (isPlaying) return;
        isPlaying = true;
        currentStep = 0;
        nextNoteTime = audioContext.currentTime + 0.03;
        schedulerId = setInterval(scheduleStep, lookaheadMs);
      }

      function stop() {
        isPlaying = false;
        if (schedulerId !== null) {
          clearInterval(schedulerId);
          schedulerId = null;
        }
        stepStatus.textContent = 'step: -';
        stepGrid.querySelectorAll('.step-btn.current').forEach((el) => el.classList.remove('current'));
      }

      playBtn.addEventListener('click', start);
      stopBtn.addEventListener('click', stop);

      buildControls();
      bindSynthControls();
      buildPresetMenu();
      loadPreset('Basic Groove');
      applyAudioParams();
    })();
  </script>
</body>
</html>
