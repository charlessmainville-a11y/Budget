<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Text to Music</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #4cc9f0;
      --accent-soft: rgba(76, 201, 240, 0.2);
      --danger: #ff6b6b;
      --ok: #7ee787;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #111827 0%, var(--bg) 60%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 20px;
    }

    .app {
      width: min(700px, 100%);
      background: var(--panel);
      border: 1px solid #30363d;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.02), 0 20px 40px rgba(0,0,0,0.45);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.25rem;
      text-align: center;
      letter-spacing: 0.2px;
    }

    .sub {
      margin: 0 0 16px;
      color: var(--muted);
      text-align: center;
      font-size: 0.92rem;
    }

    textarea {
      width: 100%;
      min-height: 170px;
      resize: vertical;
      border-radius: 10px;
      border: 1px solid #30363d;
      background: #0b0f14;
      color: var(--text);
      font: 500 0.96rem/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      padding: 14px;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 14px;
    }

    button {
      border: 1px solid #30363d;
      color: var(--text);
      background: #21262d;
      padding: 10px 14px;
      border-radius: 9px;
      font-weight: 600;
      cursor: pointer;
      transition: 120ms ease;
    }

    button:hover { border-color: #4b5563; }
    button:active { transform: translateY(1px); }

    .play { border-color: rgba(126, 231, 135, 0.45); }
    .stop { border-color: rgba(255, 107, 107, 0.45); }

    .bpm-wrap {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 240px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .status {
      margin-top: 12px;
      font-size: 0.9rem;
      color: var(--muted);
      min-height: 1.2rem;
    }

    .status.error { color: var(--danger); }
    .status.ok { color: var(--ok); }

    .step-indicator {
      margin-top: 10px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .step {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      border: 1px solid #30363d;
      background: #0b0f14;
    }

    .step.active {
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Text to Music</h1>
    <p class="sub">Type patterns, press Play, and loop instantly.</p>

    <textarea id="patternInput" spellcheck="false">kick: x---x---x---x---
snare: ----x-------x---
hat: x-x-x-x-x-x-x-x-</textarea>

    <div class="controls">
      <button id="playBtn" class="play" type="button">Play</button>
      <button id="stopBtn" class="stop" type="button">Stop</button>

      <div class="bpm-wrap">
        <label for="bpm">BPM <span id="bpmValue">110</span></label>
        <input id="bpm" type="range" min="60" max="160" value="110" />
      </div>
    </div>

    <div id="status" class="status">Ready.</div>
    <div id="stepIndicator" class="step-indicator" aria-hidden="true"></div>
  </main>

  <script>
    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');
    const bpmSlider = document.getElementById('bpm');
    const bpmValue = document.getElementById('bpmValue');
    const patternInput = document.getElementById('patternInput');
    const statusEl = document.getElementById('status');
    const stepIndicator = document.getElementById('stepIndicator');

    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    let buffers = {};
    let stepIndex = 0;
    let parsed = null;
    let nextStepTime = 0;
    let lookaheadTimer = null;

    const SOUND_URLS = {
      kick: 'https://cdn.jsdelivr.net/gh/jakesgordon/javascript-drum-machine/sounds/kick.wav',
      snare: 'https://cdn.jsdelivr.net/gh/jakesgordon/javascript-drum-machine/sounds/snare.wav',
      hat: 'https://cdn.jsdelivr.net/gh/jakesgordon/javascript-drum-machine/sounds/hihat.wav'
    };

    function setStatus(message, type = '') {
      statusEl.textContent = message;
      statusEl.className = `status ${type}`.trim();
    }

    function createStepUI(length) {
      stepIndicator.innerHTML = '';
      for (let i = 0; i < length; i += 1) {
        const dot = document.createElement('span');
        dot.className = 'step';
        stepIndicator.appendChild(dot);
      }
    }

    function highlightStep(index) {
      const dots = stepIndicator.children;
      for (let i = 0; i < dots.length; i += 1) {
        dots[i].classList.toggle('active', i === index);
      }
    }

    function parsePatterns(text) {
      const lines = text.split('\n').map(line => line.trim()).filter(Boolean);
      if (!lines.length) {
        throw new Error('Please enter at least one pattern line.');
      }

      const tracks = {};
      let maxLength = 0;

      for (const line of lines) {
        const parts = line.split(':');
        if (parts.length !== 2) {
          throw new Error(`Invalid line: "${line}". Use instrument: pattern`);
        }

        const instrument = parts[0].trim().toLowerCase();
        const pattern = parts[1].trim();

        if (!SOUND_URLS[instrument]) {
          throw new Error(`Unknown instrument "${instrument}". Use kick, snare, or hat.`);
        }

        if (!pattern || /[^x-]/i.test(pattern)) {
          throw new Error(`Pattern for ${instrument} must use only x and -.`);
        }

        const steps = [...pattern].map(ch => ch.toLowerCase() === 'x');
        tracks[instrument] = steps;
        maxLength = Math.max(maxLength, steps.length);
      }

      if (maxLength === 0) {
        throw new Error('Patterns cannot be empty.');
      }

      return { tracks, length: maxLength };
    }

    async function loadSample(url) {
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`Failed to load ${url}`);
      }
      const arrayBuffer = await response.arrayBuffer();
      return audioContext.decodeAudioData(arrayBuffer);
    }

    async function ensureBuffers() {
      if (Object.keys(buffers).length === 3) return;
      const entries = await Promise.all(Object.entries(SOUND_URLS).map(async ([name, url]) => {
        const buffer = await loadSample(url);
        return [name, buffer];
      }));
      buffers = Object.fromEntries(entries);
    }

    function playSound(name, when) {
      const buffer = buffers[name];
      if (!buffer) return;
      const source = audioContext.createBufferSource();
      source.buffer = buffer;
      source.connect(audioContext.destination);
      source.start(when);
    }

    function scheduler() {
      const secondsPerStep = 60 / Number(bpmSlider.value) / 4;
      while (nextStepTime < audioContext.currentTime + 0.12) {
        for (const [name, steps] of Object.entries(parsed.tracks)) {
          if (steps[stepIndex % steps.length]) {
            playSound(name, nextStepTime);
          }
        }

        const currentIndex = stepIndex % parsed.length;
        const delayMs = Math.max(0, (nextStepTime - audioContext.currentTime) * 1000);
        window.setTimeout(() => highlightStep(currentIndex), delayMs);

        nextStepTime += secondsPerStep;
        stepIndex += 1;
      }
    }

    function startLoop() {
      stopLoop();
      parsed = parsePatterns(patternInput.value);
      createStepUI(parsed.length);
      stepIndex = 0;
      nextStepTime = audioContext.currentTime + 0.03;
      scheduler();
      lookaheadTimer = window.setInterval(scheduler, 25);
      setStatus('Playing.', 'ok');
    }

    function stopLoop() {
      if (lookaheadTimer) {
        window.clearInterval(lookaheadTimer);
        lookaheadTimer = null;
      }
      highlightStep(-1);
      setStatus('Stopped.');
    }

    bpmSlider.addEventListener('input', () => {
      bpmValue.textContent = bpmSlider.value;
    });

    playBtn.addEventListener('click', async () => {
      try {
        if (audioContext.state !== 'running') {
          await audioContext.resume();
        }
        await ensureBuffers();
        startLoop();
      } catch (error) {
        setStatus(error.message || 'Unable to start playback.', 'error');
      }
    });

    stopBtn.addEventListener('click', () => {
      stopLoop();
    });

    createStepUI(16);
  </script>
</body>
</html>
